# Inside the "web" container. The VM's own nginx proxies the public domain to this server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    server_tokens off;

    # Laravel API (and its /up health check) → PHP-FPM in the "app" container
    location ~ ^/(api|up)(/|$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React router: unknown paths load the app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
